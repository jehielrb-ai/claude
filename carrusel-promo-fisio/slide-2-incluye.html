<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 2 - Qué incluye y tarifas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="slide">
  <div class="slide-bg" style="background-image: linear-gradient(45deg, #0f3460, #16213e, #1a1a2e);"></div>
  <div class="slide-number">02 / 04</div>
  <div class="slide-content">

    <div class="logo-header" style="margin-bottom: 25px;">
      <div class="logo-circle" style="width: 80px; height: 80px;">
        <svg viewBox="0 0 50 50" fill="white">
          <polygon points="25,8 8,28 18,28 18,42 32,42 32,28 42,28"/>
        </svg>
      </div>
      <div class="logo-text" style="font-size: 28px;">MOVIMIENTO ZENIT</div>
    </div>

    <span class="tag">¿QUÉ INCLUYE?</span>

    <div class="zenit-box" style="margin: 20px 0; padding: 35px 50px;">
      <div class="box-title" style="font-size: 56px; color: #1e90ff;">2 SESIONES FISIO</div>
      <div style="font-family: 'Bebas Neue'; font-size: 50px; color: #ffffff; margin: 8px 0;">+</div>
      <div class="box-title" style="font-size: 56px; color: #1e90ff;">1 SESIÓN PRESOTERAPIA</div>
      <div style="font-family: 'Bebas Neue'; font-size: 90px; color: #ffffff; line-height: 1; margin-top: 15px;">
        POR <span style="color: #1e90ff;">69€</span>
      </div>
    </div>

    <div style="width: 100%; margin-top: 20px;">
      <h3 style="font-family: 'Bebas Neue'; font-size: 50px; color: #ffffff; text-align: center; letter-spacing: 3px; margin-bottom: 15px;">
        TARIFAS <span style="color: #1e90ff;">PRESOTERAPIA</span>
      </h3>

      <div class="price-row" style="margin: 12px 0;">
        <div class="price-label" style="padding: 18px 25px; font-size: 34px;">1 SESIÓN</div>
        <div class="price-value" style="padding: 18px 25px; font-size: 34px;">18€</div>
      </div>

      <div class="price-row" style="margin: 12px 0;">
        <div class="price-label" style="padding: 18px 25px; font-size: 34px;">5 SESIONES</div>
        <div class="price-value" style="padding: 18px 25px; font-size: 34px;">70€ <span class="highlight" style="font-size: 24px;">(14€/SES.)</span></div>
      </div>

      <div class="price-row" style="margin: 12px 0;">
        <div class="price-label" style="padding: 18px 25px; font-size: 34px;">10 SESIONES</div>
        <div class="price-value" style="padding: 18px 25px; font-size: 34px;">100€ <span class="highlight" style="font-size: 24px;">(10€/SES.)</span></div>
      </div>
    </div>

    <div class="swipe-indicator">DESLIZA →</div>
  </div>
</div>
</body>
</html>
