<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 1 - Portada</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="slide">
  <div class="slide-bg" style="background-image: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);"></div>
  <div class="slide-number">01 / 04</div>
  <div class="slide-content">

    <div class="logo-header">
      <div class="logo-circle">
        <svg viewBox="0 0 50 50" fill="white">
          <polygon points="25,8 8,28 18,28 18,42 32,42 32,28 42,28"/>
        </svg>
      </div>
      <div class="logo-text">MOVIMIENTO ZENIT</div>
      <div class="logo-subtitle">FISIO TRAINING CLUB</div>
    </div>

    <span class="tag">PROMOCIÓN LIMITADA</span>

    <h1 class="title-xl">PROMO<br>FISIO +<br>PRESOTERAPIA</h1>

    <div class="zenit-box" style="margin-top: 50px;">
      <div class="box-text" style="font-size: 38px; margin-bottom: 15px;">SOLO POR</div>
      <div class="box-price">69€</div>
    </div>

    <div class="swipe-indicator">DESLIZA →</div>
  </div>
</div>
</body>
</html>
